name: healthcare-org gateway — prod
values:
  - key: baseUrl
    value: 'https://myhealthcare.dev'
  - key: apiKey
    description: Bearer token. Match the GATEWAY_API_KEY set on the myhealthcare Vercel project.
    secret: true
    source:
      provider: postman
      postman:
        type: cloud
        secretId: 594c86e8-6ef1-435c-a2f1-e74a7a64ba46
        vaultId: 8eb9978f-0cb1-453f-9e23-1d8a810c761f
  - key: patient_id
    value: '1'
    description: Ava Reyes (MRN-001)
  - key: source_patient_id
    value: '1'
    description: For patient-merge — "from" patient (Ava Reyes)
  - key: target_patient_id
    value: '2'
    description: For patient-merge — "into" patient (Julian Okafor)
  - key: related_to
    value: '2'
    description: 'Related patient id, for patient-relationships'
  - key: provider_id
    value: '1'
    description: Sarah Chen — Family Medicine
  - key: ordered_by
    value: '1'
    description: Provider who placed the order (Sarah Chen)
  - key: author_id
    value: '1'
    description: 'Authoring provider (notes, discharge summaries, results)'
  - key: administered_by
    value: '1'
    description: Provider who administered (e.g. immunization)
  - key: dispensed_by
    value: '1'
    description: Provider who dispensed
  - key: referring_provider_id
    value: '1'
    description: Referring provider (Sarah Chen)
  - key: referred_to_provider_id
    value: '2'
    description: 'Referred-to provider (Marcus Rodriguez, Cardiology)'
  - key: encounter_id
    value: '1'
    description: Ava's annual physical
  - key: appointment_id
    value: '1'
    description: Ava's next visit
  - key: prescription_id
    value: '1'
    description: Lisinopril 10mg for Ava
  - key: lab_order_id
    value: '1'
    description: CBC for Ava
  - key: imaging_order_id
    value: '1'
    description: Echo of heart for Ava
  - key: specimen_id
    value: '1'
    description: specimen-tracking table is empty in the seed — seed one before using
  - key: invoice_id
    value: '1'
    description: Ava's annual physical invoice
  - key: claim_id
    value: '1'
    description: Ava's annual physical claim (submitted to Aetna)
  - key: payer_id
    value: '1'
    description: Aetna
  - key: facility_id
    value: '1'
    description: Main Clinic
  - key: device_id
    value: '1'
    description: device-registry is empty in the seed
  - key: equipment_id
    value: '1'
    description: equipment is empty in the seed
  - key: agent_id
    value: '1'
    description: ai-agents is empty in the seed
  # Consent / third-party integrations
  - key: patient_consent_id
    value: '1'
    description: patient_consent is empty in the seed — create one via PATIENTS/patient_consent/Create first
  - key: docusignConsentTemplateId
    value: 'REPLACE_WITH_DOCUSIGN_TEMPLATE_ID'
    description: Mirrors DOCUSIGN_CONSENT_TEMPLATE_ID on the Vercel project (DocuSign → Templates → your consent form → Template ID). Optional — omit and pass template_id or document_base64 per-request instead.
  - key: notionDatabaseId
    value: 'REPLACE_WITH_NOTION_DATABASE_ID'
    description: Mirrors NOTION_DATABASE_ID on the Vercel project. Only needed per-request if that env var is unset.
  - key: notion_page_id
    value: 'REPLACE_WITH_NOTION_PAGE_ID'
    description: Notion pages aren't part of the Supabase seed — set this after running Notion/Create page.
  - key: drug_name
    value: 'ibuprofen'
    description: Brand or generic name searched against openFDA's public drug label data.

$kind: http-request
description: >-
  Cleanup: removes this iteration's invoicing row. Only the local row goes:
  the gateway has no PayPal cancel endpoint, so the PayPal invoice remains in
  the sandbox dashboard.
url: "{{baseUrl}}/api/invoicing/{{perf_invoice_id}}"
method: DELETE
headers:
  Authorization: Bearer {{apiKey}}
order: 12000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("invoicing row deleted (200)", function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().deleted).to.eql(true);
      });

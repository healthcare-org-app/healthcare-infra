$kind: http-request
description: >-
  Graph: GET /api/payments/:id is the status-check endpoint for a payment.
  The payment must read back linked to this iteration's invoice and amount.
url: "{{baseUrl}}/api/payments/{{perf_payment_id}}"
method: GET
headers:
  Authorization: Bearer {{apiKey}}
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("payment readable (200)", function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.have.property("id");
      });
      if (pm.variables.get("perf_target") !== "mock") {
        pm.test("payment is linked to this invoice and amount", function () {
          const body = pm.response.json();
          pm.expect(String(body.invoice_id)).to.eql(pm.collectionVariables.get("perf_invoice_id"));
          pm.expect(Number(body.amount)).to.eql(Number(pm.collectionVariables.get("perf_amount")));
        });
      }

$kind: http-request
name: 'Retry while still down'
description: 'Same request, notifications still down: no new contact change, confirmation still failed, still reported.'
method: PATCH
url: '{{baseUrl}}/api/patients/1/contact'
order: 4000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "email": "outage@example.com" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const r = pm.response.json();
      pm.test('200, changed=[], confirmation failed again, warning present', () => {
        pm.response.to.have.status(200);
        pm.expect(r.changed).to.eql([]);
        pm.expect(r.notifications).to.eql([{ channel: 'email', to: 'o***@example.com', status: 'failed', attempts: 3 }]);
        pm.expect(r.warnings).to.have.length(1);
      });

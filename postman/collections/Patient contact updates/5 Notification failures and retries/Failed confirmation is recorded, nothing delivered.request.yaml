$kind: http-request
name: 'Failed confirmation is recorded, nothing delivered'
description: 'Persisted phone and a failed marker; the earlier email confirmation is still sent.'
method: GET
url: '{{simUrl}}/patients/api/patients/1'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{apiKey}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const seed = { id: 1, status: 'active', created_at: '2026-01-15T09:30:00.000Z', first_name: 'Jane', last_name: 'Doe',
        dob: '1985-04-12', mrn: 'MRN-100234', blood_type: 'O+', identity_sub: 'auth0|jane-doe' };
      const p = pm.response.json();
      pm.test('fields outside email/phone/contact_confirmations are unchanged', () => {
        Object.keys(seed).forEach((k) => pm.expect(p[k], k).to.eql(seed[k]));
      });

      pm.test('phone persisted, phone confirmation failed, email confirmation sent', () => {
        pm.expect(p.phone).to.eql('+14155550123');
        pm.expect(p.email).to.eql('retry@example.com');
        pm.expect(p.contact_confirmations.phone.status).to.eql('failed');
        pm.expect(p.contact_confirmations.email.status).to.eql('sent');
      });

$kind: http-request
name: 'Still exactly one delivery per confirmation'
description: 'Attempts and deliveries unchanged by the second retry.'
method: GET
url: '{{simUrl}}/notifications/__calls'
order: 10000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const c = pm.response.json();
      pm.test('still six attempts, two deliveries', () => { pm.expect(c.attempts).to.eql(6); pm.expect(c.delivered).to.have.length(2); });

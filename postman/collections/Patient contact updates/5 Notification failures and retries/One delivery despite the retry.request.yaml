$kind: http-request
name: 'One delivery despite the retry'
description: 'Two attempts reached the stand-in, one notification was delivered.'
method: GET
url: '{{simUrl}}/notifications/__calls'
order: 3000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const c = pm.response.json();
      pm.test('attempts=2, delivered=1', () => { pm.expect(c.attempts).to.eql(2); pm.expect(c.delivered).to.have.length(1); });

$kind: http-request
name: 'Arm a non-retryable rejection'
description: 'The next send answers 400, which retrying cannot fix.'
method: POST
url: '{{simUrl}}/notifications/__fail'
order: 11000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {"remaining": 1, "status": 400}
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('armed', () => pm.expect(pm.response.json()).to.eql({ remaining: 1, status: 400 }));

$kind: http-request
name: 'Update email when the send is rejected with 400'
description: 'A 4xx from notifications-service is not retried: one attempt, reported as failed.'
method: PATCH
url: '{{baseUrl}}/api/patients/1/contact'
order: 12000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "email": "rejected@example.com" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const r = pm.response.json();
      pm.test('200, confirmation failed after a single attempt', () => {
        pm.response.to.have.status(200);
        pm.expect(r.notifications).to.eql([{ channel: 'email', to: 'r***@example.com', status: 'failed', attempts: 1 }]);
        pm.expect(r.patient.email).to.eql('rejected@example.com');
      });

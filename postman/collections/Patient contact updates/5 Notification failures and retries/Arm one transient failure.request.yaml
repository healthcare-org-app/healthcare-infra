$kind: http-request
name: 'Arm one transient failure'
description: 'The next send answers 503, the one after succeeds.'
method: POST
url: '{{simUrl}}/notifications/__fail'
order: 1000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {"remaining": 1, "status": 503}
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('armed', () => pm.expect(pm.response.json()).to.eql({ remaining: 1, status: 503 }));

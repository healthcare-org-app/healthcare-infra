$kind: http-request
name: 'Repeat the identical update'
description: 'Values already stored and already confirmed: 200 with nothing changed and nothing sent.'
method: PATCH
url: '{{baseUrl}}/api/patients/1/contact'
order: 1000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "email": "jane.final@example.com", "phone": "+44 20 7946 0958" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const r = pm.response.json();
      pm.test('200, changed=[] and no notifications', () => {
        pm.response.to.have.status(200);
        pm.expect(r.changed).to.eql([]);
        pm.expect(r.notifications).to.eql([]);
      });

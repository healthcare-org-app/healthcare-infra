$kind: http-request
name: 'No duplicate notification after repeat'
description: 'Still the four earlier deliveries; the repeat did not even attempt a send.'
method: GET
url: '{{simUrl}}/notifications/__calls'
order: 2000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const c = pm.response.json();
      pm.test('attempts and deliveries unchanged at 4', () => {
        pm.expect(c.attempts).to.eql(4);
        pm.expect(c.delivered).to.have.length(4);
      });

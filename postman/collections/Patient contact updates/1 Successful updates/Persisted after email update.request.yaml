$kind: http-request
name: 'Persisted after email update'
description: 'Read the record back from patients-service: only email and its confirmation changed.'
method: GET
url: '{{simUrl}}/patients/api/patients/1'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{apiKey}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const seed = { id: 1, status: 'active', created_at: '2026-01-15T09:30:00.000Z', first_name: 'Jane', last_name: 'Doe',
        dob: '1985-04-12', mrn: 'MRN-100234', blood_type: 'O+', identity_sub: 'auth0|jane-doe' };
      const p = pm.response.json();
      pm.test('fields outside email/phone/contact_confirmations are unchanged', () => {
        Object.keys(seed).forEach((k) => pm.expect(p[k], k).to.eql(seed[k]));
      });

      pm.test('email persisted, phone untouched, confirmation recorded as sent', () => {
        pm.expect(p.email).to.eql('jane.new@example.com');
        pm.expect(p.phone).to.eql('555-0142');
        pm.expect(p.contact_confirmations.email.status).to.eql('sent');
        pm.expect(p.contact_confirmations.email.value).to.eql('jane.new@example.com');
        pm.expect(p.contact_confirmations.phone).to.be.undefined;
      });

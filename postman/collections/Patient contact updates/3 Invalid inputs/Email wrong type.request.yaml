$kind: http-request
name: 'Email wrong type'
description: 'A number, not a string.'
method: PATCH
url: '{{baseUrl}}/api/patients/1/contact'
order: 2100
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "email": 12345 }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('422 invalid_email in the standard error shape', () => {
        pm.response.to.have.status(422);
        pm.expect(pm.response.json().error.code).to.eql('invalid_email');
      });

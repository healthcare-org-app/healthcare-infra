$kind: http-request
name: 'Null phone'
description: 'Clearing a contact field is not supported.'
method: PATCH
url: '{{baseUrl}}/api/patients/1/contact'
order: 2400
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "phone": null }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('422 invalid_phone in the standard error shape', () => {
        pm.response.to.have.status(422);
        pm.expect(pm.response.json().error.code).to.eql('invalid_phone');
      });

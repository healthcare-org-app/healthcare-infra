$kind: http-request
name: 'Body is not an object'
description: 'A JSON array.'
method: PATCH
url: '{{baseUrl}}/api/patients/1/contact'
order: 2700
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    ["jane@example.com"]
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 bad_body in the standard error shape', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error.code).to.eql('bad_body');
      });

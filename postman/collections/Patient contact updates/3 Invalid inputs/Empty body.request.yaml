$kind: http-request
name: 'Empty body'
description: 'Neither email nor phone.'
method: PATCH
url: '{{baseUrl}}/api/patients/1/contact'
order: 2500
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 empty_update in the standard error shape', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error.code).to.eql('empty_update');
      });

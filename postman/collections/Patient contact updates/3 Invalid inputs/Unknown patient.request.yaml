$kind: http-request
name: 'Unknown patient'
description: 'Valid input for a patient that does not exist: read-only upstream call, then 404.'
method: PATCH
url: '{{baseUrl}}/api/patients/999/contact'
order: 2900
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "email": "ghost@example.com" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('404 not_found in the standard error shape', () => {
        pm.response.to.have.status(404);
        pm.expect(pm.response.json().error.code).to.eql('not_found');
      });

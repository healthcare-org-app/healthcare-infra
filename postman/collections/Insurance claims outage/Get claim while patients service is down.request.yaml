$kind: http-request
description: The claim resolves but patients-service answers 503, so the service answers 502 and names the upstream.
method: GET
url: '{{patientsDownUrl}}/api/insurance/claims/{{claim_id}}'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('502 naming patients-service', () => {
        pm.response.to.have.status(502);
        const err = pm.response.json().error;
        pm.expect(err.code).to.eql('upstream_error');
        pm.expect(err.detail.upstream).to.eql('patients-service');
      });

$kind: http-request
description: |-
  Create a Provider Performance. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `provider_id` → `GET /api/providers`
url: "{{baseUrl}}/api/provider_performance"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "provider_id": "{{provider_id}}",
      "metric": "sample metric",
      "value": 0
    }
order: 2000

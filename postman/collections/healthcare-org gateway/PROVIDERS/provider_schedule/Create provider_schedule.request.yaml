$kind: http-request
description: |-
  Create a Provider Schedule. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `provider_id` → `GET /api/providers`
url: "{{baseUrl}}/api/provider_schedule"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "provider_id": "{{provider_id}}",
      "day_of_week": "mon",
      "start_time": "09:00",
      "end_time": "17:00"
    }
order: 2000

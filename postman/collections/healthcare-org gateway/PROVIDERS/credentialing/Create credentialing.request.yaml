$kind: http-request
description: |-
  Create a Credentialing. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `provider_id` → `GET /api/providers`
url: "{{baseUrl}}/api/credentialing"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "provider_id": "{{provider_id}}",
      "credential_type": "board_cert",
      "granted_at": "2026-01-15",
      "expires_at": "2026-01-15"
    }
order: 2000

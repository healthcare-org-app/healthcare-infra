$kind: http-request
description: |-
  Create a Appointments. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `patient_id` → `GET /api/patients`, `provider_id` → `GET /api/providers`, `facility_id` → `GET /api/facilities`
url: "{{baseUrl}}/api/appointments"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "patient_id": "{{patient_id}}",
      "provider_id": "{{provider_id}}",
      "facility_id": "{{facility_id}}",
      "starts_at": "2026-01-15T09:00:00Z",
      "duration_min": 0,
      "reason": "sample reason"
    }
order: 2000

$kind: http-request
description: |-
  Create a Demographics. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `patient_id` → `GET /api/patients`
url: "{{baseUrl}}/api/demographics"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "patient_id": "{{patient_id}}",
      "address": "sample address",
      "city": "sample city",
      "state": "sample state",
      "zip": "sample zip"
    }
order: 2000

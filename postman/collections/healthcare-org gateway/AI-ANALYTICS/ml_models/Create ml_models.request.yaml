$kind: http-request
description: Create a Ml Models. Body fields mirror `services.ts` createFields.
url: "{{baseUrl}}/api/ml_models"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "name": "sample name",
      "version": "sample version"
    }
order: 2000

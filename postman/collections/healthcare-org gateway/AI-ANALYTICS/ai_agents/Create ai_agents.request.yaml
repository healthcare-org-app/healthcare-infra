$kind: http-request
description: Create a Ai Agents. Body fields mirror `services.ts` createFields.
url: "{{baseUrl}}/api/ai_agents"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "name": "sample name",
      "model": "claude-opus",
      "description": "Sample description"
    }
order: 2000
examples: './.resources/Create ai_agents.resources/examples'

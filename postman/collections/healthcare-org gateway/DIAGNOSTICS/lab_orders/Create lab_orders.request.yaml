$kind: http-request
description: |-
  Create a Lab Orders. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `patient_id` → `GET /api/patients`, `ordered_by` → `GET /api/providers`, `encounter_id` → `GET /api/encounters`
url: "{{baseUrl}}/api/lab_orders"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "patient_id": "{{patient_id}}",
      "ordered_by": "{{ordered_by}}",
      "encounter_id": "{{encounter_id}}",
      "test_code": "CBC",
      "priority": "routine"
    }
order: 2000

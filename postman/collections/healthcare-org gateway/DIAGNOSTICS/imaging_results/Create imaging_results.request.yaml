$kind: http-request
description: |-
  Create a Imaging Results. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `patient_id` → `GET /api/patients`, `imaging_order_id` → `GET /api/imaging_orders`, `author_id` → `GET /api/providers`
url: "{{baseUrl}}/api/imaging_results"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "patient_id": "{{patient_id}}",
      "imaging_order_id": "{{imaging_order_id}}",
      "author_id": "{{author_id}}",
      "findings": "Sample findings"
    }
order: 2000

$kind: http-request
description: |-
  Create a Lab Results. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `patient_id` → `GET /api/patients`, `lab_order_id` → `GET /api/lab_orders`, `author_id` → `GET /api/providers`
url: "{{baseUrl}}/api/lab_results"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "patient_id": "{{patient_id}}",
      "lab_order_id": "{{lab_order_id}}",
      "author_id": "{{author_id}}",
      "test_code": "sample test_code",
      "result": "sample result"
    }
order: 2000

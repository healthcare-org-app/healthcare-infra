$kind: http-request
description: |-
  Create a Specimen Tracking. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `patient_id` → `GET /api/patients`, `lab_order_id` → `GET /api/lab_orders`
url: "{{baseUrl}}/api/specimen_tracking"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "patient_id": "{{patient_id}}",
      "lab_order_id": "{{lab_order_id}}",
      "specimen_type": "sample specimen_type",
      "collected_at": "2026-01-15T09:00:00Z"
    }
order: 2000

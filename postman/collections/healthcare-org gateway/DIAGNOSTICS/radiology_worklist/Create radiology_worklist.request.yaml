$kind: http-request
description: |-
  Create a Radiology Worklist. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `patient_id` → `GET /api/patients`, `imaging_order_id` → `GET /api/imaging_orders`, `provider_id` → `GET /api/providers`
url: "{{baseUrl}}/api/radiology_worklist"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "patient_id": "{{patient_id}}",
      "imaging_order_id": "{{imaging_order_id}}",
      "provider_id": "{{provider_id}}",
      "modality": "xray",
      "priority": "routine"
    }
order: 2000

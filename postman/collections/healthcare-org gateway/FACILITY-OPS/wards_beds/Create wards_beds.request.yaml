$kind: http-request
description: |-
  Create a Wards Beds. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `facility_id` → `GET /api/facilities`
url: "{{baseUrl}}/api/wards_beds"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "facility_id": "{{facility_id}}",
      "ward_name": "sample ward_name",
      "bed_count": 0
    }
order: 2000

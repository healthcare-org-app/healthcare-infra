$kind: http-request
description: |-
  Create a Equipment. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `facility_id` → `GET /api/facilities`
url: "{{baseUrl}}/api/equipment"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "name": "sample name",
      "sku": "sample sku",
      "facility_id": "{{facility_id}}"
    }
order: 2000

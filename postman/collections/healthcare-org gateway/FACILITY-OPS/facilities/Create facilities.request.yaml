$kind: http-request
description: Create a Facilities. Body fields mirror `services.ts` createFields.
url: "{{baseUrl}}/api/facilities"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "name": "sample name",
      "address": "sample address",
      "phone": "sample phone"
    }
order: 2000

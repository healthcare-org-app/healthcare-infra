$kind: http-example
name: 404 Not Found
request:
  url: '{{baseUrl}}/api/services'
  method: GET
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "unknown_resource",
          "message": "no CRUD surface for /api/services"
        }
      }
order: 1000

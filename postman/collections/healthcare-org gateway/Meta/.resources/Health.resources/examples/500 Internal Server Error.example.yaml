$kind: http-example
name: 500 Internal Server Error
request:
  url: '{{baseUrl}}/api/health'
  method: GET
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "internal",
          "message": "supabase client is not configured"
        }
      }
order: 2000

$kind: http-request
description: Save the prescription id → {{prescription_id}}.
url: "{{baseUrl}}/api/prescriptions"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "patient_id": "{{patient_id}}",
      "provider_id": "{{provider_id}}",
      "encounter_id": "{{encounter_id}}",
      "drug": "Lisinopril",
      "dose": "10mg",
      "sig": "1 tab daily"
    }
order: 5000

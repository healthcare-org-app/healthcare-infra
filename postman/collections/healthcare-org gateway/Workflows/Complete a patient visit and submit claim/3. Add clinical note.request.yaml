$kind: http-request
description: Documents the visit.
url: "{{baseUrl}}/api/clinical_notes"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "encounter_id": "{{encounter_id}}",
      "author_id": "{{provider_id}}",
      "body": "Pt presents for annual physical. Vitals stable."
    }
order: 3000

$kind: http-request
description: Creates the visit slot. Response has the appointment id.
url: "{{baseUrl}}/api/appointments"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "scheduled",
      "patient_id": "{{patient_id}}",
      "provider_id": "{{provider_id}}",
      "facility_id": "{{facility_id}}",
      "starts_at": "2026-01-15T09:00:00Z",
      "duration_min": 30,
      "reason": "Annual physical"
    }
order: 1000

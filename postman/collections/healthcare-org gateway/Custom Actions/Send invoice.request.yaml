$kind: http-request
description: >-
  Creates a PayPal draft invoice for the invoicing row and emails it to the
  patient on it. Idempotent — a repeat call reads the existing PayPal invoice
  back instead of billing twice. Body is optional; every field shown is a
  default. `include_description` puts the row's clinical description on the
  line item, which sends PHI to PayPal — leave it false unless the disclosure
  is cleared.
url: "{{baseUrl}}/api/invoicing/{{invoice_id}}/send"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "item_name": "Medical services",
      "include_description": false,
      "due_days": 30,
      "subject": "Invoice from your care team"
    }
order: 7000

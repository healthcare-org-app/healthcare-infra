$kind: http-request
description: >-
  status='cancelled'. If the appointment has a Nylas calendar invite (created
  via `Invite appointment`), withdraws it too before returning. Body is
  optional; `notify_participants` (default true) controls whether the
  calendar cancellation notice goes out. Returns 207 when the appointment is
  cancelled locally but the calendar withdrawal failed — `calendar_invite`
  in the response distinguishes "none" | "cancelled" | "failed".
url: "{{baseUrl}}/api/appointments/{{appointment_id}}/cancel"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "notify_participants": true
    }
examples: './.resources/Cancel appointment.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200 or 207", function () {
        pm.expect([200, 207]).to.include(pm.response.code);
      });
      pm.test("response has a valid calendar_invite contract", function () {
        const body = pm.response.json();
        pm.expect(body).to.have.property("id");
        pm.expect(body.status).to.eql("cancelled");
        pm.expect(body).to.have.property("calendar_invite");
        pm.expect(["none", "cancelled", "failed"]).to.include(body.calendar_invite.status);
        if (pm.response.code === 207) {
          pm.expect(body.calendar_invite.status).to.eql("failed");
        }
      });
order: 2000

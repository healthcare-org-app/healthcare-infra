$kind: http-request
description: Inserts queued notification.
url: "{{baseUrl}}/api/notifications/send"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "to": "user@example.com",
      "channel": "email",
      "subject": "Hello",
      "body": "Test message"
    }
order: 6000

$kind: http-example
name: 404 Not Found
request:
  url: '{{baseUrl}}/api/patient_consent/{{patient_consent_id}}/signature-status?include_documents=true&include_disclosure=false'
  method: GET
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "not_found",
          "message": "no patient_consent with id 999999"
        }
      }
order: 3000

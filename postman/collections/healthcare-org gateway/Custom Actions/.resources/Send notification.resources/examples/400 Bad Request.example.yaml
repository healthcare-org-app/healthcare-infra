$kind: http-example
name: 400 Bad Request
request:
  url: '{{baseUrl}}/api/notifications/send'
  method: POST
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "bad_channel",
          "message": "'channel' must be one of: email, sms, push"
        }
      }
order: 2000

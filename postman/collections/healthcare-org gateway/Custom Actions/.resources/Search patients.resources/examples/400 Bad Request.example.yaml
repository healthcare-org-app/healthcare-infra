$kind: http-example
name: 400 Bad Request
request:
  url: '{{baseUrl}}/api/patients/search?q=reyes'
  method: GET
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "missing_q",
          "message": "query parameter 'q' is required"
        }
      }
order: 2000

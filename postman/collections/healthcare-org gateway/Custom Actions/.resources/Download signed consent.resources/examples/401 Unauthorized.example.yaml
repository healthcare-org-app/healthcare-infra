$kind: http-example
name: 401 Unauthorized
request:
  url: '{{baseUrl}}/api/patient_consent/{{patient_consent_id}}/signed-document?document_id=combined'
  method: GET
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "unauthorized",
          "message": "missing bearer token"
        }
      }
order: 2000

$kind: http-example
name: 500 Internal Server Error
request:
  url: '{{baseUrl}}/api/patient_consent/{{patient_consent_id}}/signed-document?document_id=combined'
  method: GET
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "db_error",
          "message": "connection to the database timed out"
        }
      }
order: 5000

$kind: http-request
description: >-
  Updates only the properties named in the body; everything else on the page
  is left alone. `{"archived": true}` archives the page — Notion has no page
  delete, and archiving is reversible with `{"archived": false}`.
url: "{{baseUrl}}/api/notion/pages/{{notion_page_id}}"
method: PATCH
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "properties": {
        "Status": "In review"
      }
    }
order: 3000

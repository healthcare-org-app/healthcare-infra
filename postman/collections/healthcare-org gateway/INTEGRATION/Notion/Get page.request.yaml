$kind: http-request
description: >-
  Reads one page's properties (not its block content). The response carries
  `property_types`, which is what a subsequent PATCH needs to shape its
  values correctly. A page id Notion has not been shared with 404s, same as
  a page that does not exist.
url: "{{baseUrl}}/api/notion/pages/{{notion_page_id}}"
method: GET
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
examples: './.resources/Get page.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("page carries property_types for a follow-up PATCH", function () {
        const body = pm.response.json();
        pm.expect(body.id).to.be.a("string");
        pm.expect(body.property_types).to.be.an("object");
      });
order: 2000

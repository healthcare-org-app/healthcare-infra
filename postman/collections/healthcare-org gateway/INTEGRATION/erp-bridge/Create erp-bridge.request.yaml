$kind: http-request
description: Create a Erp Bridge. Body fields mirror `services.ts` createFields.
url: "{{baseUrl}}/api/erp-bridge"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "event_type": "sample event_type",
      "payload": "Sample payload"
    }
order: 2000

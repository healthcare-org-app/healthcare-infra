$kind: http-example
name: 404 Not Found
request:
  url: '{{baseUrl}}/api/erp-bridge/1'
  method: GET
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "not_found",
          "message": "no erp-bridge with id 999999"
        }
      }
order: 3000

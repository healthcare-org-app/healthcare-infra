$kind: http-request
description: >-
  Lists the connected clinician's inbox (`limit` 1–200, default 25; bodies
  withheld from the list view since it renders wholesale in the admin UI).
  Pass `message_id` instead to open one message, body included — that read is
  audit-logged.
url: "{{baseUrl}}/api/nylas/inbox?provider_id={{provider_id}}"
method: GET
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
queryParams:
  provider_id: '{{provider_id}}'
examples: './.resources/Read inbox.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("lists inbox messages without leaking bodies", function () {
        const body = pm.response.json();
        pm.expect(body.messages).to.be.an("array");
        if (body.messages.length > 0) {
          pm.expect(body.messages[0]).to.not.have.property("body");
        }
      });
order: 6000

$kind: http-request
description: >-
  Lists the connected clinician's inbox (`limit` 1–200, default 25; bodies
  withheld from the list view since it renders wholesale in the admin UI).
  Pass `message_id` instead to open one message, body included — that read is
  audit-logged.
url: "{{baseUrl}}/api/nylas/inbox?provider_id={{provider_id}}"
method: GET
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
queryParams:
  provider_id: '{{provider_id}}'
order: 6000

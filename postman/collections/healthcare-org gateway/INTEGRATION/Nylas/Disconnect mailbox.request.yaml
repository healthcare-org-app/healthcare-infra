$kind: http-request
description: >-
  Disconnects a clinician's mailbox: revokes the grant upstream, then marks
  the local row "revoked" (kept, not deleted, for the audit trail). 409
  `not_connected` if the provider never connected one.
url: "{{baseUrl}}/api/nylas/disconnect"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "provider_id": "{{provider_id}}"
    }
examples: './.resources/Disconnect mailbox.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("grant is marked revoked", function () {
        pm.expect(pm.response.json().status).to.eql("revoked");
      });
order: 3000

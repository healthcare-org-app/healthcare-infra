$kind: http-request
description: >-
  Sends mail from the connected clinician's mailbox (as them, not from a
  clinic-wide sender). `idempotency_key` makes a retried send replay instead
  of duplicating — vary it for genuinely distinct messages.
url: "{{baseUrl}}/api/nylas/inbox"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "provider_id": "{{provider_id}}",
      "to": [{ "email": "patient@example.com" }],
      "subject": "Your upcoming appointment",
      "body": "This is a reminder about your visit."
    }
examples: './.resources/Send mail.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("mail was accepted for delivery", function () {
        const body = pm.response.json();
        pm.expect(body.delivery_status).to.eql("sent");
        pm.expect(body.message_id).to.be.a("string");
      });
order: 7000

$kind: http-request
description: >-
  Starts the mailbox connection flow for one clinician. Returns an `auth_url`
  (valid for `expires_in` seconds) rather than issuing a redirect — the caller
  navigates the clinician to it. `provider` is optional and one of google,
  microsoft, imap, virtual-calendar; `login_hint` optionally pre-fills the
  account picker.
url: "{{baseUrl}}/api/nylas/connect"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "provider_id": "{{provider_id}}",
      "provider": "google"
    }
examples: './.resources/Connect mailbox.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("returns a usable hosted-auth handoff", function () {
        const body = pm.response.json();
        pm.expect(body.auth_url).to.include("nylas.com/v3/connect/auth");
        pm.expect(body.expires_in).to.eql(600);
        pm.expect(body.state).to.be.a("string");
      });
order: 1000

$kind: http-request
description: |-
  Create a Charge Capture. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `patient_id` → `GET /api/patients`, `encounter_id` → `GET /api/encounters`, `provider_id` → `GET /api/providers`
url: "{{baseUrl}}/api/charge_capture"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "patient_id": "{{patient_id}}",
      "encounter_id": "{{encounter_id}}",
      "provider_id": "{{provider_id}}",
      "cpt_code": "sample cpt_code",
      "amount": 0
    }
order: 2000

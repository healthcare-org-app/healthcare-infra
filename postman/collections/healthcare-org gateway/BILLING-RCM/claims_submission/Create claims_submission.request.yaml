$kind: http-request
description: |-
  Create a Claims Submission. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `patient_id` → `GET /api/patients`, `provider_id` → `GET /api/providers`, `encounter_id` → `GET /api/encounters`, `payer_id` → `GET /api/payer_directory`, `prescription_id` → `GET /api/prescriptions`, `lab_order_id` → `GET /api/lab_orders`, `imaging_order_id` → `GET /api/imaging_orders`
url: "{{baseUrl}}/api/claims_submission"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "patient_id": "{{patient_id}}",
      "provider_id": "{{provider_id}}",
      "encounter_id": "{{encounter_id}}",
      "payer_id": "{{payer_id}}",
      "prescription_id": "{{prescription_id}}",
      "lab_order_id": "{{lab_order_id}}",
      "imaging_order_id": "{{imaging_order_id}}",
      "diagnosis_codes": "I10, E11.9",
      "amount": 0
    }
order: 2000

$kind: http-request
description: |-
  Create a Claims Adjudication. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `claim_id` → `GET /api/claims_submission`
url: "{{baseUrl}}/api/claims_adjudication"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "claim_id": "{{claim_id}}",
      "decision": "approved"
    }
order: 2000

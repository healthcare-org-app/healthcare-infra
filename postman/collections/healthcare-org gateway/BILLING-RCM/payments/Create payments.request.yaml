$kind: http-request
description: |-
  Create a Payments. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `patient_id` → `GET /api/patients`, `invoice_id` → `GET /api/invoicing`
url: "{{baseUrl}}/api/payments"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "patient_id": "{{patient_id}}",
      "invoice_id": "{{invoice_id}}",
      "amount": 0,
      "method": "card"
    }
order: 2000

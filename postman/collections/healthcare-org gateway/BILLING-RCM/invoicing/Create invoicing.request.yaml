$kind: http-request
description: |-
  Create a Invoicing. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `patient_id` → `GET /api/patients`, `encounter_id` → `GET /api/encounters`, `claim_id` → `GET /api/claims_submission`
url: "{{baseUrl}}/api/invoicing"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "pending",
      "patient_id": "{{patient_id}}",
      "encounter_id": "{{encounter_id}}",
      "claim_id": "{{claim_id}}",
      "amount": 0,
      "description": "sample description"
    }
order: 2000

$kind: http-request
description: |-
  Create a Referrals. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `patient_id` → `GET /api/patients`, `referring_provider_id` → `GET /api/providers`, `referred_to_provider_id` → `GET /api/providers`
url: "{{baseUrl}}/api/referrals"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "patient_id": "{{patient_id}}",
      "referring_provider_id": "{{referring_provider_id}}",
      "referred_to_provider_id": "{{referred_to_provider_id}}",
      "reason": "sample reason"
    }
order: 2000

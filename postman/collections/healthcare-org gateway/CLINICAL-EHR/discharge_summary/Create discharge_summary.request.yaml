$kind: http-request
description: |-
  Create a Discharge Summary. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `encounter_id` → `GET /api/encounters`, `patient_id` → `GET /api/patients`, `author_id` → `GET /api/providers`
url: "{{baseUrl}}/api/discharge_summary"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "encounter_id": "{{encounter_id}}",
      "patient_id": "{{patient_id}}",
      "author_id": "{{author_id}}",
      "summary": "Sample summary"
    }
order: 2000

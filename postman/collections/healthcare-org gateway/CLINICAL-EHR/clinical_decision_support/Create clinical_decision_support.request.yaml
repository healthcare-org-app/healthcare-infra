$kind: http-request
description: |-
  Create a Clinical Decision Support. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `patient_id` → `GET /api/patients`, `encounter_id` → `GET /api/encounters`, `provider_id` → `GET /api/providers`
url: "{{baseUrl}}/api/clinical_decision_support"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "patient_id": "{{patient_id}}",
      "encounter_id": "{{encounter_id}}",
      "provider_id": "{{provider_id}}",
      "alert_type": "sample alert_type",
      "recommendation": "Sample recommendation"
    }
order: 2000

$kind: http-request
description: |-
  Create a Ehr. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `patient_id` → `GET /api/patients`
url: "{{baseUrl}}/api/ehr"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "patient_id": "{{patient_id}}",
      "record_type": "sample record_type",
      "content": "Sample content"
    }
order: 2000

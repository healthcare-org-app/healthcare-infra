$kind: http-request
description: |-
  Create a Problem List. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `patient_id` → `GET /api/patients`, `encounter_id` → `GET /api/encounters`
url: "{{baseUrl}}/api/problem_list"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "patient_id": "{{patient_id}}",
      "encounter_id": "{{encounter_id}}",
      "condition": "sample condition",
      "icd10": "sample icd10",
      "onset_at": "2026-01-15"
    }
order: 2000

$kind: http-request
description: Create a Tenancy. Body fields mirror `services.ts` createFields.
url: "{{baseUrl}}/api/tenancy"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "name": "sample name",
      "tier": "trial"
    }
order: 2000

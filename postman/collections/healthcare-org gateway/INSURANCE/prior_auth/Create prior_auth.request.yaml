$kind: http-request
description: |-
  Create a Prior Auth. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `patient_id` → `GET /api/patients`, `provider_id` → `GET /api/providers`, `payer_id` → `GET /api/payer_directory`
url: "{{baseUrl}}/api/prior_auth"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "patient_id": "{{patient_id}}",
      "provider_id": "{{provider_id}}",
      "payer_id": "{{payer_id}}",
      "service_code": "sample service_code"
    }
order: 2000

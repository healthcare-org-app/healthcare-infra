$kind: http-request
description: |-
  Create a Payer Edi Connect. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `payer_id` → `GET /api/payer_directory`
url: "{{baseUrl}}/api/payer_edi_connect"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "payer_id": "{{payer_id}}",
      "endpoint": "sample endpoint"
    }
order: 2000

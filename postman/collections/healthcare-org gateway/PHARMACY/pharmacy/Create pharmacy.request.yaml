$kind: http-request
description: |-
  Create a Pharmacy. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `prescription_id` → `GET /api/prescriptions`
url: "{{baseUrl}}/api/pharmacy"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "prescription_id": "{{prescription_id}}",
      "filled_at": "2026-01-15T09:00:00Z"
    }
order: 2000

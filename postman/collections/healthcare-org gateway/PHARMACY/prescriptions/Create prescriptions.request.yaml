$kind: http-request
description: |-
  Create a Prescriptions. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `patient_id` → `GET /api/patients`, `provider_id` → `GET /api/providers`, `encounter_id` → `GET /api/encounters`
url: "{{baseUrl}}/api/prescriptions"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "patient_id": "{{patient_id}}",
      "provider_id": "{{provider_id}}",
      "encounter_id": "{{encounter_id}}",
      "drug": "sample drug",
      "dose": "10mg",
      "sig": "1 tab daily"
    }
order: 2000

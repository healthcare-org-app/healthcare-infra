$kind: http-request
description: |-
  Create a Dispensing. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `prescription_id` → `GET /api/prescriptions`, `dispensed_by` → `GET /api/providers`
url: "{{baseUrl}}/api/dispensing"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "prescription_id": "{{prescription_id}}",
      "dispensed_at": "2026-01-15T09:00:00Z",
      "dispensed_by": "{{dispensed_by}}"
    }
order: 2000

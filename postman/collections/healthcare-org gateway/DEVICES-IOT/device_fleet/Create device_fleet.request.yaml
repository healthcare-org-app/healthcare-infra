$kind: http-request
description: |-
  Create a Device Fleet. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `device_id` → `GET /api/device_registry`
url: "{{baseUrl}}/api/device_fleet"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "device_id": "{{device_id}}",
      "fleet_name": "sample fleet_name"
    }
order: 2000

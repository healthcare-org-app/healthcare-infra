$kind: http-request
description: |-
  Create a Remote Monitoring. Body fields mirror `services.ts` createFields.

  **FK references (fetch these first):** `patient_id` → `GET /api/patients`, `device_id` → `GET /api/device_registry`
url: "{{baseUrl}}/api/remote_monitoring"
method: POST
headers:
  Authorization: Bearer {{apiKey}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "patient_id": "{{patient_id}}",
      "device_id": "{{device_id}}"
    }
order: 2000

  collection:
    id: 78dd6fc9-0a09-4756-9487-803d5b788fab
    name: Patient contact updates
    description:
      content: |-
        PATCH /api/patients/{id}/contact updates a patient's email and/or phone and sends a confirmation per
        changed channel. The record is read and written on patients-service and the confirmation goes through
        notifications-service; both are the stateful stand-ins in patient-contact-dev.sim.yaml, which expose
        /__reset and /__calls (and /__fail on notifications) so the run can assert on persisted data, on
        delivered notifications and on the calls rejected requests did NOT make.

        Run against the local service and simulation (no other setup):

            scripts/dev-sim.sh start postman/simulations/patient-contact-dev.sim.yaml
            scripts/dev-insurance.sh start
            postman collection run "postman/collections/Patient contact updates" \
              --simulation postman/simulations/patient-contact-dev.sim.yaml --port 4300
            scripts/dev-insurance.sh stop; scripts/dev-sim.sh stop

        Requests run in order and share stand-in state; each folder starts from a reset or a snapshot.
        A hard notifications outage (503) is in the separate "Patient contact updates outage" collection.
      type: text/plain

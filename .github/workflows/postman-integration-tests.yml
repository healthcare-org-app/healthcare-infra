name: Postman integration tests

on:
  pull_request:
    paths:
      - "frontend/api/**"
      - "postman/collections/healthcare-org gateway/**"
      - "postman/mocks/healthcare-org-gateway/**"
      - ".github/workflows/postman-integration-tests.yml"
  push:
    branches: [main]
    paths:
      - "frontend/api/**"
      - "postman/collections/healthcare-org gateway/**"
      - "postman/environments/healthcare-org gateway — prod.environment.yaml"
      - ".github/workflows/postman-integration-tests.yml"

jobs:
  lint-collection:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g postman-cli
      - run: postman collection lint "postman/collections/healthcare-org gateway" -f error

  test-new-integrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: lint-collection
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g postman-cli
      # Targets the local mock generated from this collection's saved examples,
      # not live prod — Cancel/Invite/Send mail/Create page all have real
      # third-party side effects (Nylas email + calendar, Notion writes), so a
      # PR-triggered run must never hit the real integrations.
      # -r junit is not supported for this v3 (git-native) collection format,
      # so the CLI's own exit code — nonzero on any failed pm.test — is the
      # actual gate; the log is captured only for convenience.
      - name: Run Nylas/Notion/OpenFDA/Invite/Cancel appointment tests against the mock
        run: |
          set -o pipefail
          postman collection run "postman/collections/healthcare-org gateway" \
            --use-mock "{{baseUrl}} mock:./postman/mocks/healthcare-org-gateway/config.yaml" \
            -i "Custom Actions/Cancel appointment" \
            -i "Custom Actions/Invite appointment" \
            -i "INTEGRATION/Nylas/Connect mailbox" \
            -i "INTEGRATION/Nylas/Disconnect mailbox" \
            -i "INTEGRATION/Nylas/OAuth callback" \
            -i "INTEGRATION/Nylas/Check availability" \
            -i "INTEGRATION/Nylas/List calendar" \
            -i "INTEGRATION/Nylas/Read inbox" \
            -i "INTEGRATION/Nylas/Send mail" \
            -i "INTEGRATION/Notion/Create page" \
            -i "INTEGRATION/Notion/Get page" \
            -i "INTEGRATION/Notion/Update page" \
            -i "INTEGRATION/OpenFDA/Search drug ingredients" \
            --env-var apiKey=ci-mock-key \
            --env-var provider_id=1 \
            --env-var appointment_id=1 \
            --env-var notion_page_id=b1a2c3d4-e5f6-7890-abcd-ef1234567890 \
            --env-var drug_name=ibuprofen \
            --no-report-events \
            | tee postman-run.log
      - name: Publish run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-run-log
          path: postman-run.log

  test-case-management:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: lint-collection
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g postman-cli
      # Case Management is a plain CRUD resource (Supabase-backed via the generic
      # [resource]/index.ts + [id].ts gateway handlers), not a third-party
      # integration — targets the local mock same as test-new-integrations, since
      # a PR-triggered run must never hit the live Supabase-backed prod gateway.
      # -r junit is not supported for this v3 (git-native) collection format,
      # so the CLI's own exit code — nonzero on any failed pm.test — is the
      # actual gate; the log is captured only for convenience.
      - name: Run Case Management CRUD tests against the mock
        run: |
          set -o pipefail
          postman collection run "postman/collections/healthcare-org gateway" \
            --use-mock "{{baseUrl}} mock:./postman/mocks/healthcare-org-gateway/config.yaml" \
            -i "List case_management" \
            -i "Create case_management" \
            -i "Get case_management by id" \
            -i "Update case_management" \
            -i "Delete case_management" \
            --env-var apiKey=ci-mock-key \
            --no-report-events \
            | tee postman-run.log
      - name: Publish run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-run-log-case-management
          path: postman-run.log

  post-deploy-smoke-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g postman-cli
      - run: postman login --with-api-key "$POSTMAN_API_KEY"
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
      # Sync the merged collection/environment (including case_management) to
      # the cloud workspace the "healthcare-monitor" Monitor is linked to —
      # gated to this push-to-main job, never the PR jobs above, since this is
      # the one command here that writes shared cloud state.
      - run: postman workspace push -y
      # No deploy-completion webhook exists between Vercel and this repo, so
      # this is a best-effort fixed wait for Vercel's auto-deploy (usually
      # well under a minute for this app) rather than a confirmed signal.
      - name: Wait for Vercel auto-deploy
        run: sleep 60
      # Runs the full "healthcare-monitor" collection (all ~95 CRUD resources,
      # including case_management) against live prod — writes and deletes
      # real test rows in Supabase on every merge to main. --async: don't
      # block this job on the run; failures surface via the monitor's own
      # email notifications (see the monitor's --notify-email config) rather
      # than this CI step's exit code.
      - run: postman monitor run 1f1bdc76-f2fe-4f30-98b7-ec9691fb76d9 --async

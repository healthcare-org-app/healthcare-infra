  - {name: payer-edi-connect,          port: 8804, lang: python, http_deps: [payer-directory, secrets-vault, audit-log-service],                                         publishes: [audit.event],                                                                                subscribes: [claim.submitted]}
  - {name: claims-status-service,      port: 8805, lang: python, http_deps: [claims-submission-service, payer-edi-connect, audit-log-service],                          publishes: [audit.event],                                                                                subscribes: [claim.submitted, claim.adjudicated]}

  # ─── Devices / IoT (5) ───────────────────────────────────────────
  - {name: device-registry-service,    port: 8900, lang: python, http_deps: [patients-service, audit-log-service],                                                       publishes: [audit.event],                                                                                subscribes: []}
  - {name: device-telemetry-service,   port: 8901, lang: go,     http_deps: [device-registry-service],                                                                    publishes: [device.reading],                                                                              subscribes: []}
  - {name: device-alerts-service,      port: 8902, lang: python, http_deps: [device-registry-service, notifications-service, care-teams-service, audit-log-service],    publishes: [device.alert.triggered, audit.event],                                                        subscribes: [device.reading]}
  - {name: device-fleet-service,       port: 8903, lang: python, http_deps: [device-registry-service, audit-log-service],                                                publishes: [audit.event],                                                                                subscribes: []}
  - {name: remote-monitoring-service,  port: 8904, lang: python, http_deps: [device-registry-service, patients-service, care-teams-service, audit-log-service],          publishes: [audit.event],                                                                                subscribes: [device.reading, device.alert.triggered]}

  # ─── Communications (5) ──────────────────────────────────────────

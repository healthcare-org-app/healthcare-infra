# Service registry — the source of truth for every service in the org.
# Each entry: name, port (host-side dev port), language, http_deps (sync REST peers),
# publishes (Kafka topics), subscribes (Kafka topics).
#
# 100 services grouped by domain.

services:
  # ─── Platform (10) ───────────────────────────────────────────────
  - {name: identity-service,           port: 8001, lang: python, http_deps: [audit-log-service],                                                                    publishes: [identity.user.created, identity.user.deactivated, audit.event],                             subscribes: []}
  - {name: auth-service,               port: 8002, lang: python, http_deps: [identity-service, authorization-service, audit-log-service],                            publishes: [auth.session.started, audit.event],                                                          subscribes: [identity.user.deactivated]}
  - {name: authorization-service,      port: 8003, lang: python, http_deps: [identity-service, audit-log-service],                                                    publishes: [audit.event],                                                                                subscribes: [identity.user.created]}
  - {name: api-gateway,                port: 8000, lang: go,     http_deps: [auth-service, authorization-service, service-registry],                                  publishes: [audit.event],                                                                                subscribes: []}
  - {name: service-registry,           port: 8004, lang: go,     http_deps: [],                                                                                        publishes: [],                                                                                            subscribes: []}
  - {name: config-service,             port: 8005, lang: python, http_deps: [auth-service, audit-log-service],                                                        publishes: [audit.event],                                                                                subscribes: []}
  - {name: secrets-vault,              port: 8006, lang: python, http_deps: [auth-service, audit-log-service],                                                        publishes: [audit.event],                                                                                subscribes: []}
  - {name: audit-log-service,          port: 8007, lang: python, http_deps: [],                                                                                        publishes: [],                                                                                            subscribes: [audit.event]}
  - {name: feature-flags-service,      port: 8008, lang: python, http_deps: [auth-service, audit-log-service],                                                        publishes: [audit.event],                                                                                subscribes: []}
  - {name: tenancy-service,            port: 8009, lang: python, http_deps: [audit-log-service],                                                                      publishes: [audit.event],                                                                                subscribes: []}

  # ─── Patients (10) ───────────────────────────────────────────────
  - {name: patients-service,           port: 8100, lang: python, http_deps: [identity-service, auth-service, audit-log-service, notifications-service],              publishes: [patient.created, patient.updated, audit.event],                                             subscribes: [identity.user.created]}
  - {name: demographics-service,       port: 8101, lang: python, http_deps: [patients-service, audit-log-service],                                                    publishes: [audit.event],                                                                                subscribes: [patient.updated]}
  - {name: patient-consent-service,    port: 8102, lang: python, http_deps: [patients-service, audit-log-service],                                                    publishes: [patient.consent.updated, audit.event],                                                       subscribes: [patient.created]}
  - {name: patient-preferences-service, port: 8103, lang: python, http_deps: [patients-service, audit-log-service],                                                   publishes: [audit.event],                                                                                subscribes: [patient.created]}
  - {name: patient-portal-api,         port: 8104, lang: node,   http_deps: [auth-service, patients-service, appointments-service, lab-results-service, imaging-results-service, prescriptions-service, invoicing-service, secure-messaging-service], publishes: [audit.event], subscribes: []}
  - {name: patient-relationships-service, port: 8105, lang: python, http_deps: [patients-service, audit-log-service],                                                 publishes: [audit.event],                                                                                subscribes: [patient.created, patient.merged]}
  - {name: patient-timeline-service,   port: 8106, lang: python, http_deps: [patients-service, ehr-service, audit-log-service],                                       publishes: [audit.event],                                                                                subscribes: [patient.created, patient.updated, patient.merged, encounter.started, lab.result.available, imaging.result.available, prescription.issued, appointment.booked, invoice.issued]}
  - {name: patient-search-service,     port: 8107, lang: python, http_deps: [patients-service, audit-log-service],                                                    publishes: [audit.event],                                                                                subscribes: [patient.created, patient.updated, patient.merged]}
  - {name: patient-merge-service,      port: 8108, lang: python, http_deps: [patients-service, ehr-service, billing-service, audit-log-service],                     publishes: [patient.merged, audit.event],                                                                subscribes: []}
  - {name: patient-communications-service, port: 8109, lang: python, http_deps: [patients-service, notifications-service, audit-log-service],                        publishes: [audit.event],                                                                                subscribes: [patient.created]}

  # ─── Providers (9) ───────────────────────────────────────────────
  - {name: providers-service,          port: 8200, lang: python, http_deps: [identity-service, audit-log-service, erp-hr],                                            publishes: [audit.event],                                                                                subscribes: [identity.user.created]}
  - {name: credentialing-service,      port: 8201, lang: python, http_deps: [providers-service, audit-log-service],                                                   publishes: [audit.event],                                                                                subscribes: []}
  - {name: licensing-service,          port: 8202, lang: python, http_deps: [providers-service, audit-log-service],                                                   publishes: [audit.event],                                                                                subscribes: []}
  - {name: specialties-service,        port: 8203, lang: python, http_deps: [providers-service, audit-log-service],                                                   publishes: [audit.event],                                                                                subscribes: []}
  - {name: provider-schedule-service,  port: 8204, lang: python, http_deps: [providers-service, appointments-service, audit-log-service],                            publishes: [audit.event],                                                                                subscribes: [appointment.booked, appointment.cancelled]}
  - {name: on-call-service,            port: 8205, lang: python, http_deps: [providers-service, provider-schedule-service, audit-log-service],                       publishes: [audit.event],                                                                                subscribes: []}
  - {name: provider-directory,         port: 8206, lang: python, http_deps: [providers-service, specialties-service, credentialing-service, audit-log-service],       publishes: [audit.event],                                                                                subscribes: []}
  - {name: provider-portal-api,        port: 8207, lang: node,   http_deps: [auth-service, providers-service, provider-schedule-service, ehr-service, cpoe-service, secure-messaging-service], publishes: [audit.event], subscribes: []}
  - {name: provider-performance-service, port: 8208, lang: python, http_deps: [providers-service, ehr-service, audit-log-service],                                    publishes: [audit.event],                                                                                subscribes: [encounter.ended]}

  # ─── Clinical / EHR (15) ─────────────────────────────────────────
  - {name: ehr-service,                port: 8300, lang: python, http_deps: [patients-service, providers-service, encounters-service, audit-log-service],             publishes: [audit.event],                                                                                subscribes: [patient.created, patient.updated, patient.merged, encounter.started, lab.result.available, imaging.result.available]}
  - {name: encounters-service,         port: 8301, lang: python, http_deps: [patients-service, providers-service, appointments-service, audit-log-service],           publishes: [encounter.started, encounter.ended, audit.event],                                            subscribes: [appointment.booked]}
  - {name: clinical-notes-service,     port: 8302, lang: python, http_deps: [ehr-service, providers-service, audit-log-service],                                     publishes: [audit.event],                                                                                subscribes: [encounter.started]}
  - {name: problem-list-service,       port: 8303, lang: python, http_deps: [patients-service, ehr-service, audit-log-service],                                       publishes: [audit.event],                                                                                subscribes: []}
  - {name: med-reconciliation-service, port: 8304, lang: python, http_deps: [prescriptions-service, ehr-service, audit-log-service],                                   publishes: [audit.event],                                                                                subscribes: [encounter.started, prescription.issued]}
  - {name: allergies-service,          port: 8305, lang: python, http_deps: [patients-service, drug-interactions-service, audit-log-service],                          publishes: [audit.event],                                                                                subscribes: []}
  - {name: immunizations-service,      port: 8306, lang: python, http_deps: [patients-service, audit-log-service],                                                    publishes: [audit.event],                                                                                subscribes: []}
  - {name: vitals-service,             port: 8307, lang: python, http_deps: [patients-service, encounters-service, audit-log-service],                                publishes: [audit.event],                                                                                subscribes: [encounter.started, device.reading]}
  - {name: cpoe-service,               port: 8308, lang: python, http_deps: [ehr-service, drug-interactions-service, formulary-service, audit-log-service],           publishes: [order.placed, audit.event],                                                                  subscribes: [lab.result.available, imaging.result.available]}
  - {name: care-plan-service,          port: 8309, lang: python, http_deps: [ehr-service, care-teams-service, audit-log-service],                                     publishes: [audit.event],                                                                                subscribes: []}
  - {name: referrals-service,          port: 8310, lang: python, http_deps: [providers-service, patients-service, audit-log-service],                                 publishes: [audit.event],                                                                                subscribes: []}
  - {name: discharge-summary-service,  port: 8311, lang: python, http_deps: [ehr-service, clinical-notes-service, audit-log-service],                                 publishes: [audit.event],                                                                                subscribes: [encounter.ended]}
  - {name: clinical-decision-support,  port: 8312, lang: python, http_deps: [ehr-service, ai-invocations-service, drug-interactions-service, audit-log-service],      publishes: [audit.event],                                                                                subscribes: [lab.result.available, encounter.started]}
  - {name: diagnosis-codes-service,    port: 8313, lang: python, http_deps: [audit-log-service],                                                                       publishes: [audit.event],                                                                                subscribes: []}
  - {name: care-teams-service,         port: 8314, lang: python, http_deps: [providers-service, patients-service, audit-log-service],                                  publishes: [audit.event],                                                                                subscribes: [encounter.started, device.alert.triggered]}

  # ─── Diagnostics (8) ─────────────────────────────────────────────
  - {name: lab-orders-service,         port: 8400, lang: python, http_deps: [cpoe-service, patients-service, providers-service, audit-log-service],                    publishes: [audit.event],                                                                                subscribes: [order.placed]}
  - {name: lab-results-service,        port: 8401, lang: python, http_deps: [lab-orders-service, reference-ranges-service, patients-service, notifications-service, audit-log-service], publishes: [lab.result.available, audit.event], subscribes: []}
  - {name: imaging-orders-service,     port: 8402, lang: python, http_deps: [cpoe-service, patients-service, providers-service, audit-log-service],                    publishes: [audit.event],                                                                                subscribes: [order.placed]}
  - {name: imaging-results-service,    port: 8403, lang: python, http_deps: [imaging-orders-service, patients-service, notifications-service, audit-log-service],       publishes: [imaging.result.available, audit.event],                                                     subscribes: []}
  - {name: pathology-service,          port: 8404, lang: python, http_deps: [specimen-tracking-service, patients-service, audit-log-service],                          publishes: [audit.event],                                                                                subscribes: []}
  - {name: radiology-worklist,         port: 8405, lang: python, http_deps: [imaging-orders-service, providers-service, audit-log-service],                            publishes: [audit.event],                                                                                subscribes: [order.placed]}
  - {name: specimen-tracking-service,  port: 8406, lang: python, http_deps: [lab-orders-service, audit-log-service],                                                    publishes: [audit.event],                                                                                subscribes: []}
  - {name: reference-ranges-service,   port: 8407, lang: python, http_deps: [audit-log-service],                                                                        publishes: [audit.event],                                                                                subscribes: []}

  # ─── Pharmacy (7) ────────────────────────────────────────────────
  - {name: pharmacy-service,           port: 8500, lang: python, http_deps: [prescriptions-service, formulary-service, pharmacy-inventory-service, audit-log-service], publishes: [audit.event],                                                                                subscribes: [order.placed, prescription.issued, prescription.refill_requested]}
  - {name: prescriptions-service,      port: 8501, lang: python, http_deps: [patients-service, providers-service, drug-interactions-service, formulary-service, notifications-service, audit-log-service], publishes: [prescription.issued, audit.event], subscribes: []}
  - {name: refills-service,            port: 8502, lang: python, http_deps: [prescriptions-service, pharmacy-service, audit-log-service],                              publishes: [prescription.refill_requested, audit.event],                                                subscribes: []}
  - {name: drug-interactions-service,  port: 8503, lang: python, http_deps: [audit-log-service],                                                                        publishes: [audit.event],                                                                                subscribes: []}
  - {name: formulary-service,          port: 8504, lang: python, http_deps: [audit-log-service],                                                                        publishes: [audit.event],                                                                                subscribes: []}
  - {name: pharmacy-inventory-service, port: 8505, lang: python, http_deps: [audit-log-service],                                                                        publishes: [audit.event],                                                                                subscribes: [prescription.issued]}
  - {name: dispensing-service,         port: 8506, lang: python, http_deps: [prescriptions-service, pharmacy-inventory-service, audit-log-service],                    publishes: [audit.event],                                                                                subscribes: [prescription.issued]}

  # ─── Scheduling (5) ──────────────────────────────────────────────
  - {name: appointments-service,       port: 8600, lang: python, http_deps: [patients-service, providers-service, appointment-slots-service, room-booking-service, notifications-service, audit-log-service], publishes: [appointment.booked, appointment.cancelled, audit.event], subscribes: []}
  - {name: appointment-slots-service,  port: 8601, lang: python, http_deps: [provider-schedule-service, audit-log-service],                                             publishes: [audit.event],                                                                                subscribes: [appointment.booked, appointment.cancelled]}
  - {name: reminders-service,          port: 8602, lang: python, http_deps: [notifications-service, patients-service, audit-log-service],                              publishes: [audit.event],                                                                                subscribes: [appointment.booked]}
  - {name: waitlist-service,           port: 8603, lang: python, http_deps: [appointments-service, patients-service, notifications-service, audit-log-service],         publishes: [audit.event],                                                                                subscribes: [appointment.cancelled]}
  - {name: room-booking-service,       port: 8604, lang: python, http_deps: [facilities-service, wards-beds-service, audit-log-service],                                publishes: [audit.event],                                                                                subscribes: [appointment.booked]}

  # ─── Billing / RCM (10) ──────────────────────────────────────────
  - {name: billing-service,            port: 8700, lang: python, http_deps: [patients-service, invoicing-service, claims-submission-service, audit-log-service],       publishes: [audit.event],                                                                                subscribes: [encounter.ended, patient.merged]}
  - {name: charge-capture-service,     port: 8701, lang: python, http_deps: [ehr-service, coding-service, audit-log-service],                                           publishes: [charge.captured, audit.event],                                                              subscribes: [encounter.ended]}
  - {name: coding-service,             port: 8702, lang: python, http_deps: [diagnosis-codes-service, audit-log-service],                                               publishes: [audit.event],                                                                                subscribes: []}
  - {name: claims-submission-service,  port: 8703, lang: python, http_deps: [patients-service, providers-service, coverage-verification-service, coding-service, payer-edi-connect, audit-log-service], publishes: [claim.submitted, audit.event], subscribes: [charge.captured, patient.merged]}
  - {name: claims-adjudication-service, port: 8704, lang: python, http_deps: [claims-submission-service, coverage-verification-service, audit-log-service],             publishes: [claim.adjudicated, audit.event],                                                            subscribes: [claim.submitted]}
  - {name: denials-service,            port: 8705, lang: python, http_deps: [claims-adjudication-service, audit-log-service],                                            publishes: [audit.event],                                                                                subscribes: [claim.adjudicated]}
  - {name: invoicing-service,          port: 8706, lang: python, http_deps: [patients-service, claims-adjudication-service, audit-log-service],                          publishes: [invoice.issued, audit.event],                                                               subscribes: [claim.adjudicated, charge.captured, invoice.paid]}
  - {name: payments-service,           port: 8707, lang: python, http_deps: [invoicing-service, notifications-service, audit-log-service],                              publishes: [invoice.paid, audit.event],                                                                 subscribes: []}
  - {name: statements-service,         port: 8708, lang: python, http_deps: [invoicing-service, patients-service, notifications-service, audit-log-service],            publishes: [audit.event],                                                                                subscribes: [invoice.issued, invoice.paid]}
  - {name: collections-service,        port: 8709, lang: python, http_deps: [invoicing-service, patients-service, notifications-service, audit-log-service],            publishes: [audit.event],                                                                                subscribes: [invoice.paid]}

  # ─── Insurance (6) ───────────────────────────────────────────────
  - {name: eligibility-service,        port: 8800, lang: python, http_deps: [payer-directory, payer-edi-connect, audit-log-service],                                    publishes: [audit.event],                                                                                subscribes: [patient.created]}
  - {name: prior-auth-service,         port: 8801, lang: python, http_deps: [eligibility-service, providers-service, payer-edi-connect, audit-log-service],             publishes: [audit.event],                                                                                subscribes: []}
  - {name: coverage-verification-service, port: 8802, lang: python, http_deps: [eligibility-service, patients-service, audit-log-service],                              publishes: [audit.event],                                                                                subscribes: []}

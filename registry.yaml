  - {name: sms-gateway-service,        port: 9001, lang: go,     http_deps: [secrets-vault, audit-log-service],                                                           publishes: [audit.event],                                                                                subscribes: [notification.requested]}
  - {name: email-gateway-service,      port: 9002, lang: python, http_deps: [secrets-vault, audit-log-service],                                                           publishes: [audit.event],                                                                                subscribes: [notification.requested]}
  - {name: push-gateway-service,       port: 9003, lang: python, http_deps: [secrets-vault, audit-log-service],                                                           publishes: [audit.event],                                                                                subscribes: [notification.requested]}
  - {name: secure-messaging-service,   port: 9004, lang: node,   http_deps: [auth-service, patients-service, providers-service, audit-log-service],                       publishes: [audit.event],                                                                                subscribes: []}

  # ─── AI / Analytics (5) ──────────────────────────────────────────
  - {name: ai-agents-service,          port: 9100, lang: python, http_deps: [patient-consent-service, audit-log-service],                                                publishes: [audit.event],                                                                                subscribes: []}
  - {name: ai-invocations-service,     port: 9101, lang: python, http_deps: [ai-agents-service, ml-models-service, patient-consent-service, audit-log-service],          publishes: [audit.event],                                                                                subscribes: [lab.result.available, encounter.started]}
  - {name: analytics-events-service,   port: 9102, lang: python, http_deps: [audit-log-service],                                                                          publishes: [audit.event],                                                                                subscribes: [auth.session.started, patient.created, encounter.ended, claim.adjudicated, invoice.paid, device.reading]}
  - {name: reporting-service,          port: 9103, lang: python, http_deps: [analytics-events-service, audit-log-service],                                                publishes: [audit.event],                                                                                subscribes: []}
  - {name: ml-models-service,          port: 9104, lang: python, http_deps: [secrets-vault, audit-log-service],                                                           publishes: [audit.event],                                                                                subscribes: []}

  # ─── Facility / Operations (5) ───────────────────────────────────
  - {name: facilities-service,         port: 9200, lang: python, http_deps: [audit-log-service],                                                                          publishes: [audit.event],                                                                                subscribes: []}
  - {name: wards-beds-service,         port: 9201, lang: python, http_deps: [facilities-service, audit-log-service],                                                      publishes: [audit.event],                                                                                subscribes: [encounter.started, encounter.ended]}
  - {name: equipment-service,          port: 9202, lang: python, http_deps: [facilities-service, audit-log-service, erp-inventory],                                       publishes: [audit.event],                                                                                subscribes: []}
  - {name: sterile-supply-service,     port: 9203, lang: python, http_deps: [equipment-service, audit-log-service, erp-procurement],                                      publishes: [audit.event],                                                                                subscribes: []}
  - {name: maintenance-service,        port: 9204, lang: python, http_deps: [equipment-service, facilities-service, audit-log-service],                                   publishes: [audit.event],                                                                                subscribes: []}


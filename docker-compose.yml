version: "3.9"

# Shared infrastructure for the healthcare-org platform.
# All 100 services connect to these containers. Individual services declare
# themselves via `docker-compose.override.yml` files in their own repos.

networks:
  healthcare_net:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  redis_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: healthcare_postgres
    environment:
      POSTGRES_USER: healthcare
      POSTGRES_PASSWORD: healthcare_dev
      POSTGRES_MULTIPLE_DATABASES: "identity,auth,patients,providers,ehr,lab,imaging,pharmacy,insurance,claims,billing,notifications,devices,ai_agents,audit"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - healthcare_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node KRaft broker (combined broker + controller). No ZooKeeper.
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: healthcare_kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      CLUSTER_ID: "aGVhbHRoY2FyZWthZmthMQ"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - healthcare_net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: healthcare_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./topics.yaml:/topics.yaml:ro
      - ./seed/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    networks:
      - healthcare_net

  redis:
    image: redis:7-alpine
    container_name: healthcare_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - healthcare_net

  service-registry:
    image: consul:1.15
    container_name: healthcare_consul
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0
    networks:
      - healthcare_net
